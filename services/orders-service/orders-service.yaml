openapi: 3.1.0
info:
  title: Nexo Commerce - Orders Service API
  version: 1.0.0
  description: |
    Contrato HTTP del microservicio de pedidos.
    Responsable del ciclo de vida del pedido para cliente, operador y administrador.
servers:
  - url: https://api.example.com/v1
    description: Producción
  - url: http://localhost:3005/v1
    description: Desarrollo local

tags:
  - name: Mis pedidos
  - name: Operador
  - name: Administrador

security:
  - bearerAuth: []

paths:
  /me/orders:
    get:
      tags: [Mis pedidos]
      summary: Listar pedidos propios
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          {
            description: Historial,
            content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/orders/{orderId}:
    get:
      tags: [Mis pedidos]
      summary: Ver pedido propio
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          {
            description: Pedido,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Mis pedidos]
      summary: Solicitar cancelación de pedido
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          {
            description: Pedido cancelado,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '409':
          {
            description: El pedido ya no se puede cancelar,
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

  /operator/orders:
    get:
      tags: [Operador]
      summary: Bandeja de pedidos para preparar
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          {
            description: Pedidos operativos,
            content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/orders/{orderId}/status:
    patch:
      tags: [Operador]
      summary: Avanzar estado operativo del pedido
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/OrderStatusUpdate' } } }
      responses:
        '200':
          {
            description: Estado actualizado,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          {
            description: Transición inválida,
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

  /operator/orders/{orderId}/issues:
    post:
      tags: [Operador]
      summary: Registrar merma o problema de stock
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderIssueInput' } } }
      responses:
        '201':
          {
            description: Incidencia registrada,
            content: { application/json: { schema: { $ref: '#/components/schemas/OrderIssue' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders:
    get:
      tags: [Administrador]
      summary: Supervisar todas las transacciones
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          {
            description: Pedidos globales,
            content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/{orderId}/cancel:
    post:
      tags: [Administrador]
      summary: Cancelar pedido bajo reglas de negocio
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelOrderInput' } } }
      responses:
        '200':
          {
            description: Pedido cancelado,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          {
            description: Cancelación no permitida,
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

components:
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    OrderId:
      {
        name: orderId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 50 },
      }
  responses:
    BadRequest:
      {
        description: Datos inválidos,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Unauthorized:
      {
        description: Token faltante o inválido,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Forbidden:
      {
        description: Rol insuficiente,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NotFound:
      {
        description: Recurso no encontrado,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    OrderStatus:
      {
        type: string,
        enum:
          [pendiente_pago, confirmado, en_preparacion, preparado, enviado, entregado, cancelado],
      }
    Order:
      type: object
      required: [id, customer, totalCents, status, createdAt]
      properties:
        id: { type: string }
        customer: { type: string }
        totalCents: { type: integer, minimum: 0 }
        currency: { type: string, enum: [USD, ARS] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        issue: { type: string }
        createdAt: { type: string, format: date-time }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [preparado, enviado, entregado] } }
    OrderIssueInput:
      type: object
      required: [description]
      properties: { description: { type: string, minLength: 2, maxLength: 1000 } }
    OrderIssue:
      allOf: [{ $ref: '#/components/schemas/OrderIssueInput' }]
      type: object
      required: [id, createdAt]
      properties: { id: { type: string }, createdAt: { type: string, format: date-time } }
    CancelOrderInput:
      type: object
      properties: { reason: { type: string, maxLength: 500 } }
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    OrderPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR] }
        message: { type: string }
        details: { type: object, additionalProperties: true }
