openapi: 3.1.0
info:
  title: Nexo Commerce - Catalog Service API
  version: 1.0.0
  description: |
    Contrato HTTP del microservicio de catálogo.
    Responsable de productos, categorías y precios (en centavos).
servers:
  - url: https://api.example.com/v1
    description: Producción
  - url: http://localhost:3002/v1
    description: Desarrollo local

tags:
  - name: Catálogo
  - name: Administrador

security:
  - bearerAuth: []

paths:
  /products:
    get:
      tags: [Catálogo]
      security: []
      summary: Listar productos activos
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: category
          in: query
          schema: { type: string }
        - name: maxPriceCents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, priceAsc, priceDesc], default: relevance }
      responses:
        '200':
          description: Catálogo paginado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
    post:
      tags: [Administrador]
      summary: Crear producto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Producto creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{productId}:
    get:
      tags: [Catálogo]
      security: []
      summary: Obtener detalle de producto
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200':
          description: Producto con stock actual
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Administrador]
      summary: Editar producto
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } }
      responses:
        '200':
          {
            description: Producto actualizado,
            content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Administrador]
      summary: Eliminación lógica de producto
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '204': { description: Producto desactivado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      tags: [Catálogo]
      security: []
      summary: Listar categorías planas activas
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
    post:
      tags: [Administrador]
      summary: Crear categoría
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '201':
          {
            description: Categoría creada,
            content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    BadRequest:
      {
        description: Datos inválidos,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Unauthorized:
      {
        description: Token faltante o inválido,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Forbidden:
      {
        description: Rol insuficiente,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NotFound:
      {
        description: Recurso no encontrado,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ProductInput:
      type: object
      required: [name, categoryId, priceCents, stock]
      properties:
        name: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: string }
        priceCents: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        images: { type: array, minItems: 1, items: { type: string, format: uri } }
    ProductPatch:
      allOf: [{ $ref: '#/components/schemas/ProductInput' }]
      type: object
      properties: { active: { type: boolean } }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, rating, active, updatedAt]
          properties:
            id: { type: integer }
            rating: { type: number, minimum: 0, maximum: 5 }
            active: { type: boolean }
            updatedAt: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 2, maxLength: 80 } }
    Category:
      allOf: [{ $ref: '#/components/schemas/CategoryInput' }]
      type: object
      required: [id, active]
      properties: { id: { type: string }, active: { type: boolean } }
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    ProductPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR] }
        message: { type: string }
        details: { type: object, additionalProperties: true }
