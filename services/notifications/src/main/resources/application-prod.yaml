spring:
  rabbitmq:
    host: ${NOTIFICATIONS_RABBITMQ_HOST}
    port: ${NOTIFICATIONS_RABBITMQ_PORT:5671}
    username: ${NOTIFICATIONS_RABBITMQ_USERNAME}
    password: ${NOTIFICATIONS_RABBITMQ_PASSWORD}
    virtual-host: ${NOTIFICATIONS_RABBITMQ_VIRTUAL_HOST} # Se sugiere incluir el vhost para CloudAMQP
    ssl:
      enabled: ${NOTIFICATIONS_RABBITMQ_SSL_ENABLED:true} # <--- IMPORTANTE PARA CLOUDAMQP (Puerto 5671)
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
        default-requeue-rejected: false
  mail:
    host: ${NOTIFICATIONS_MAIL_HOST}
    port: ${NOTIFICATIONS_MAIL_PORT:587}
    username: ${NOTIFICATIONS_MAIL_USERNAME}
    password: ${NOTIFICATIONS_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

clients:
  auth:
    internal-api-key: ${NOTIFICATIONS_INTERNAL_API_KEY}

notifications:
  mail:
    from: ${NOTIFICATIONS_MAIL_FROM}

eureka:
  client:
    enabled: false