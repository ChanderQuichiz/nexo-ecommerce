server:
  port: 8083

spring:
  application:
    name: notifications-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

messaging:
  orders:
    exchange: orders.exchange
    queue: notifications.queue
    routing-keys:
      created: orders.created
      updated: orders.updated
      paid: orders.paid

notifications:
  receipt:
    currency: PEN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
