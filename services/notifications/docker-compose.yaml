services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notifications_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - notifications_rabbitmq_data:/var/lib/rabbitmq
      - ../../docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  notifications_rabbitmq_data:
