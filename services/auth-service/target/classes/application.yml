server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: my-super-secret-key-for-nexo-ecommerce-2026-change-me
  expiration-ms: 3600000
  issuer: nexo-ecommerce

logging:
  level:
    org.springframework.security: INFO
    com.nexo.ecommerce.auth: DEBUG
