server:
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: ${GATEWAY_PORT:8082}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
            allowedMethods:
              - GET
              - POST
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
      routes:
        - id: auth-service
          uri: ${AUTH_ROUTE_URI:lb://AUTH-SERVICE}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: orders-service
          uri: ${ORDERS_ROUTE_URI:lb://ORDERS-SERVICE}
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: catalog-service
          uri: ${CATALOG_ROUTE_URI:lb://CATALOG-SERVICE}
          predicates:
            - Path=/api/catalog/**
          filters:
            - StripPrefix=1
        - id: notifications-service
          uri: ${NOTIFICATIONS_ROUTE_URI:lb://NOTIFICATIONS-SERVICE}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: stripe-webhook
          uri: ${ORDERS_ROUTE_URI:lb://ORDERS-SERVICE}
          predicates:
            - Path=/api/webhooks/stripe
          filters:
            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
