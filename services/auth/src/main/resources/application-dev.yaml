spring:
  datasource:
    url: jdbc:postgresql://auth-postgres:5432/auth_db
    username: auth
    password: auth
  flyway:
    url: jdbc:postgresql://auth-postgres:5432/auth_db
    user: auth
    password: auth
  data:
    redis:
      host: auth-redis
      port: 6379
      password: ""

auth:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
  admin:
    name: Administrador
    email: admin@gmail.com
    password: ${AUTH_ADMIN_PASSWORD:example_admin_password}
  jwt:
    secret: ${AUTH_JWT_SECRET:example_dev_jwt_secret_key_minimum_32_bytes}
  internal-api-key: ${AUTH_INTERNAL_API_KEY:example_internal_api_key}

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: http://discovery:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
