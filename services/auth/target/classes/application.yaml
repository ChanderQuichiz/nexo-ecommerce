server:
  port: 8084

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DATABASE_URL:jdbc:postgresql://auth-postgres:5432/auth_db}
    username: ${AUTH_DATABASE_USERNAME:auth}
    password: ${AUTH_DATABASE_PASSWORD:auth}
  flyway:
    enabled: true
    user: ${AUTH_DATABASE_USERNAME:auth}
    password: ${AUTH_DATABASE_PASSWORD:auth}
    url: ${AUTH_DATABASE_URL:jdbc:postgresql://auth-postgres:5432/auth_db}
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${AUTH_REDIS_HOST:auth-redis}
      port: ${AUTH_REDIS_PORT:6379}
      password: ${AUTH_REDIS_PASSWORD:}

auth:
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://dhingra.tech}
  admin:
    name: Administrador
    email: ${AUTH_ADMIN_EMAIL:admin@gmail.com}
    password: ${AUTH_ADMIN_PASSWORD:12345678}
  jwt:
    secret: ${AUTH_JWT_SECRET:bG9jYWwtZGV2LWp3dC1zZWNyZXQta2V5LWZvci1uZXhvLWVjb21tZXJjZQ==}
    expiration: 15m
    issuer: nexo-ecommerce
  internal-api-key: ${AUTH_INTERNAL_API_KEY:local-nexo-internal-key}

eureka:
  client:
    serviceUrl:
      defaultZone: ${AUTH_EUREKA_URL:http://discovery:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
