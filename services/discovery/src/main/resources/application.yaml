server:
  address: 0.0.0.0
  port: 8761

spring:
  application:
    name: discovery-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: ${HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
