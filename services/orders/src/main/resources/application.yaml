spring:
  application:
    name: orders-service
  datasource:
    url: ${ORDERS_DATABASE_URL:jdbc:postgresql://orders-postgres:5432/postgres}
    username: ${ORDERS_DATABASE_USERNAME:postgres}
    password: ${ORDERS_DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  rabbitmq:
    host: ${ORDERS_RABBITMQ_HOST:rabbitmq}
    port: ${ORDERS_RABBITMQ_PORT:5672}
    username: ${ORDERS_RABBITMQ_USERNAME:guest}
    password: ${ORDERS_RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      catalog-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

constants:
  currency: PEN
stripe:
  api-key: ${ORDERS_STRIPE_API_KEY:sk_test_replace_me}
  webhook:
    secret: ${ORDERS_STRIPE_WEBHOOK_SECRET:whsec_replace_me}

eureka:
  client:
    serviceUrl:
      defaultZone: ${ORDERS_EUREKA_URL:http://discovery:8761/eureka/}
  instance:
    prefer-ip-address: true
