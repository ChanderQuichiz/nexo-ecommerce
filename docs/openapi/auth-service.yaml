openapi: 3.0.3
info:
  title: Servicio de autenticación
  description: >
    API de autenticación de Nexo Ecommerce. El registro público siempre asigna
    el rol Client. Los roles administrativos se provisionan mediante un proceso
    administrativo confiable y no se pueden seleccionar en una solicitud pública.
  version: 1.0.0
servers:
  - url: http://localhost:8084/auth
    description: Servicio local de autenticación
  - url: https://api.ecommerce.com/auth
    description: Ruta publicada por el API Gateway
paths:
  /login:
    post:
      summary: Iniciar sesión
      operationId: login
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
              required: [email, password]
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales inválidas
  /register:
    post:
      summary: Registrar usuario
      operationId: register
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required: [name, email, password]
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Correo ya registrado o datos inválidos
  /me:
    get:
      summary: Consultar el usuario autenticado
      tags: [Autenticación]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Datos públicos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /logout:
    post:
      summary: Cerrar sesión y revocar el token
      tags: [Autenticación]
      security:
        - BearerAuth: []
      description: Agrega el JWT actual a la lista de revocación en Redis hasta su expiración.
      responses:
        "204":
          description: Sesión revocada correctamente
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [Admin, Client]
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
tags:
  - name: Autenticación
    description: Registro de cuentas, inicio y cierre de sesión.
