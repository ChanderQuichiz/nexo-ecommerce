openapi: 3.1.0
info:
  title: Nexo Commerce - Inventory Service API
  version: 1.0.0
  description: |
    Contrato HTTP del microservicio de inventario.
    Responsable del stock operativo (consulta y ajustes) usado por el rol operador.
servers:
  - url: https://api.example.com/v1
    description: Producción
  - url: http://localhost:3003/v1
    description: Desarrollo local

tags:
  - name: Operador

security:
  - bearerAuth: []

paths:
  /operator/inventory:
    get:
      tags: [Operador]
      summary: Consultar inventario
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: lowStock
          in: query
          schema: { type: boolean }
      responses:
        '200':
          {
            description: Inventario,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/InventoryPage' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Operador]
      summary: Ajustar stock
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustment' } } }
      responses:
        '200':
          {
            description: Stock actualizado,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/InventoryItem' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          {
            description: El ajuste dejaría stock negativo,
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

components:
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    BadRequest:
      {
        description: Datos inválidos,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Forbidden:
      {
        description: Rol insuficiente,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    StockAdjustment:
      type: object
      required: [productId, delta]
      properties:
        productId: { type: integer, minimum: 1 }
        delta: { type: integer }
        reason: { type: string, maxLength: 500 }
    InventoryItem:
      type: object
      required: [productId, stock]
      properties:
        productId: { type: integer }
        stock: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    InventoryPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/InventoryItem' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR] }
        message: { type: string }
        details: { type: object, additionalProperties: true }
