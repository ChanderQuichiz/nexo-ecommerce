name: Reusable Deploy to ECR

on:
  workflow_call:
    inputs:
      service-dir:
        description: 'Carpeta del microservicio en el monorepo'
        required: true
        type: string
      ecr-repo:
        description: 'Nombre del repositorio en Amazon ECR'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurar JDK para compilar Spring Boot con Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 2. Compilar el microservicio omitiendo los tests
      - name: Build with Maven (Skip Tests)
        run: |
          cd ${{ inputs.service-dir }}
          mvn clean package -DskipTests

      # 3. Configurar credenciales de AWS usando las acciones oficiales
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Cambia a tu región de AWS (ej. us-west-2)

      # 4. Iniciar sesión en Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Construir, Etiquetar y Subir la imagen Docker a ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ${{ inputs.service-dir }}
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push --all-tags $REGISTRY/$REPOSITORY