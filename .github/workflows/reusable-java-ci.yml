name: Reusable Java CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      java_version:
        required: false
        type: string
        default: '21'

jobs:
  build-and-test:
    name: Build and Test ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify
        working-directory: ${{ inputs.service_path }}
        run: ./mvnw clean verify
        env:
          # Permite que Testcontainers funcione sin problemas en GH Actions
          TESTCONTAINERS_RYUK_DISABLED: false 
