services:
  discovery:
    build: ./services/discovery
    ports:
      - "127.0.0.1:8761:8761"

  gateway:
    build: ./services/gateway
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - discovery
      - auth
      - orders
      - catalog
      - notifications

  auth:
    build: ./services/auth
    depends_on:
      discovery:
        condition: service_started
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy

  orders:
    build: ./services/orders
    depends_on:
      discovery:
        condition: service_started
      catalog:
        condition: service_started
      orders-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog:
    build: ./services/catalog
    depends_on:
      discovery:
        condition: service_started
      catalog-postgres:
        condition: service_healthy

  notifications:
    build: ./services/notifications
    depends_on:
      discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auth", "-d", "auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders-postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  auth-postgres-data:
  orders-postgres-data:
  catalog-postgres-data:
  rabbitmq-data:
